<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="converter">
    <h1>Temperature Converter</h1>
    <label for="tempInput">Enter Temperature</label>
    <input type="text" id="tempInput" placeholder="e.g., 25" />

    <label for="unitSelect">From Unit</label>
    <select id="unitSelect">
      <option value="C">Celsius (°C)</option>
      <option value="F">Fahrenheit (°F)</option>
      <option value="K">Kelvin (K)</option>
    </select>

    <div id="errorMsg" class="error" role="alert"></div>
    <button type="button" id="convertBtn">Convert</button>

    <div class="results" id="results">
      <p id="outC">Celsius: —</p>
      <p id="outF">Fahrenheit: —</p>
      <p id="outK">Kelvin: —</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
